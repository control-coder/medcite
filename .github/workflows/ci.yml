name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 检索测试注入确定性编码器，无需下载模型。开启离线标志，
      # 让意外的模型下载直接失败，避免检查依赖网络且耗时不可控。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      # 仅展示覆盖率，不增加覆盖率门槛；部分 CLI 入口保留人工演示验证。
      - name: Pytest
        run: >
          python -m pytest -q
          --cov=medidiag --cov=eval --cov-report=term-missing

      # 自 2026-07-26 起，历史类型问题已从 97 项降至 14 项再归零。
      # 保留已启用的严格类型检查，防止已有问题重新累积，不新增审查门槛。
      - name: Mypy
        run: mypy src
