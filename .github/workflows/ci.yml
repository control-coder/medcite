name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The retrieval tests inject a deterministic token-hashing encoder, so no
      # model download is expected. These flags turn any unexpected Hugging Face
      # fetch into a loud failure instead of a slow, network-dependent pass.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest -q

      # Non-blocking. `strict = true` in pyproject.toml is aspirational for this
      # codebase: a strict run currently reports a large backlog of missing
      # annotations that predates this workflow and must not gate unrelated
      # changes. Left visible so the backlog can be burned down, and flipped to
      # blocking once it reaches zero.
      - name: Mypy (non-blocking backlog)
        continue-on-error: true
        run: mypy src
