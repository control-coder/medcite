name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The retrieval tests inject a deterministic token-hashing encoder, so no
      # model download is expected. These flags turn any unexpected Hugging Face
      # fetch into a loud failure instead of a slow, network-dependent pass.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      # Coverage is reported, not gated. A threshold is a policy decision about
      # which code must be tested; adding one here would fail the build on
      # untested CLI entry points that are deliberately exercised by hand.
      - name: Pytest
        run: >
          python -m pytest -q
          --cov=medidiag --cov=eval --cov-report=term-missing

      # Blocking since 2026-07-26: the backlog reached zero (97 -> 14 -> 0), so
      # `strict = true` in pyproject.toml is now enforced rather than aspirational.
      # New untyped code should fail here instead of quietly re-growing the backlog.
      - name: Mypy
        run: mypy src
