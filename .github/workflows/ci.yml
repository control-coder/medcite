name: CI

on:
  push:
    branches: ["main", "feat/eval-scale-abstention"]  # TEMP: 验证分支 CI，合并前移除
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 检索测试注入确定性编码器，无需下载模型。开启离线标志，
      # 让意外的模型下载直接失败，避免检查依赖网络且耗时不可控。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      # 仅展示覆盖率，不增加覆盖率门槛；部分 CLI 入口保留人工演示验证。
      - name: Pytest
        run: >
          python -m pytest -q
          --cov=medidiag --cov=eval --cov-report=term-missing

      # 自 2026-07-26 起，历史类型问题已从 97 项降至 14 项再归零。
      # 保留已启用的严格类型检查，防止已有问题重新累积，不新增审查门槛。
      - name: Mypy
        run: mypy src

  # 浏览器级端到端：真实 API + 独立 worker + retrieval_mock（真实 BM25 检索，无模型、无密钥）。
  # 使用 Playwright 自带 Chromium；本机验收仍默认用已安装的 Edge。
  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MEDIDIAG_VERIFY_ANY_ENV: "1"
      MEDIDIAG_BROWSER_CHANNEL: chromium

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci --prefix frontend

      - name: 构建前端（含 tsc 类型检查）
        run: npm run build --prefix frontend

      - name: 安装 Chromium
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: 浏览器端到端（retrieval_mock）
        run: python scripts/verify_offline.py --provider retrieval_mock --browser

      - name: 失败时保留日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: .cache/implementation/
          retention-days: 7
