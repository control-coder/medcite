[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medidiag"
version = "0.1.0"
description = "MediDiag-Agent EvidenceFlow: 医疗循证诊断多 Agent 工作流平台（模拟，仅用于工程演示与公开数据评测）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MediDiag Project" }]
keywords = ["medical", "rag", "agent", "evidence-based", "diagnosis", "workflow"]

dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "openai>=1.30",
    "sentence-transformers>=2.7",
    "transformers>=4.41",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "click>=8.1",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
medidiag = "medidiag.cli:main"
medidiag-eval = "eval.runner:cli"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["medidiag*", "eval*"]

[tool.setuptools.package-data]
medidiag = [
    "api/templates/*.html",
    "api/templates/partials/*.html",
    "api/static/*.css",
    "api/static/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
