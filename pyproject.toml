[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medidiag"
version = "0.1.0"
description = "MedCite：带证据引用的医疗信息辅助分析原型（仅公开与模拟数据）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "control-coder" }]
keywords = ["medical", "rag", "agent", "evidence-based", "diagnosis", "workflow"]

dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "celery[redis]>=5.5,<6",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sentence-transformers>=2.7",
    "transformers>=4.41",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "click>=8.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
medidiag = "medidiag.cli:main"
medidiag-eval = "eval.runner:cli"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["medidiag*", "eval*"]

[tool.setuptools.package-data]
medidiag = [
    "api/templates/*.html",
    "api/templates/partials/*.html",
    "api/static/*.css",
    "api/static/*.js",
    "llm/profiles.yaml",
    "rag/medical_terms/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",
    # UP042：枚举值已持久化，并与数据库字符串比较；改成 StrEnum 会改变
    # str(member) 的结果，因此不能直接按规则批量替换。
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# B008：FastAPI 需要在参数默认值处解析 Depends()；移入函数体会破坏依赖注入。
"src/medidiag/api/app.py" = ["B008"]
# B023：阶段 lambda 虽然捕获循环变量，但 ProviderCallRunner 会在本轮迭代内
# 同步调用，不存在规则警告的延迟绑定风险。
"src/medidiag/workflow/worker.py" = ["B023"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
