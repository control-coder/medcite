# 应用配置：v4 语料的混合检索（BM25 字符二元组 + 向量）+ 交叉编码器重排 + MMR 去冗余。
# 固定版本的 bge-small-zh 与 bge-reranker-v2-m3，只读本地缓存，不自动下载。
# 语料为 v4 父子分块的子块（M6 产物），保存在本机 .cache/corpus/chunks/parent_child/chunks.jsonl，
# 不入库；使用前需按 examples/public_health_v4/README.md 数据卡复现采集、解析与分块流程。
# 分词与混合参数先按计划默认值填写，最终取值以 M8 离线对比结果（eval/hybrid_matrix.py）为准。
application:
  mode: retrieval_mock
  topology: single
runtime:
  device: cpu
  batch_size: 8
embedding:
  model: BAAI/bge-small-zh-v1.5
  revision: 7999e1d3359715c523056ef9478215996d62a620
  local_files_only: true
dataset:
  version: public-health-v4
  knowledge_base_path: .cache/corpus/chunks/parent_child/chunks.jsonl
  rag_eval_set_path: examples/public_health_v4/queries.jsonl
  agent_eval_set_path: examples/public_health_v4/queries.jsonl
retrieval:
  method: hybrid
  bm25_tokenizer: cjk_bigram
  top_k: 3
  hybrid:
    candidates: 20
    rrf_k: 60
    mmr_lambda: 0.7
  rerank:
    model: BAAI/bge-reranker-v2-m3
    revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
    local_files_only: true
    candidates: 20
# 摘录未通过校验时，带原因重试一次
generation:
  on_invalid: feedback
leakage_check:
  chunk_fields_to_check: [source, source_id, metadata.raw_id]
  check_question_text: true
  check_answer_key: true
