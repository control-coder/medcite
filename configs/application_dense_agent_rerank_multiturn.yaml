# 应用配置：向量检索 + 检索 Agent + 交叉编码器重排，另开启多轮追问的问题补全。检索、重排与生成的设置与
# application_dense_agent_rerank.yaml 完全相同；只多一项 generation.context_rewrite：病例带上一轮（parent_case_id）时，
# 检索前先用最近 3 轮历史把追问补全成可以单独理解的问题（提示词版本 context-rewrite-v1，每个追问多 1 次调用），
# 检索、重排与生成都使用补全后的问题；补全失败时回退到原问题并记录原因。单轮问题不调用补全，请求与原配置逐字相同。
# 仅供 mimo_grounded 使用，需要先准备两个模型的本地缓存。评测见 docs/evaluation.md。
application:
  mode: retrieval_mock
  topology: single
runtime:
  device: cpu
  batch_size: 8
embedding:
  model: BAAI/bge-small-zh-v1.5
  revision: 7999e1d3359715c523056ef9478215996d62a620
  local_files_only: true
dataset:
  version: public-health-excerpts-v3
  knowledge_base_path: examples/public_health_v3/chunks.jsonl
  rag_eval_set_path: examples/public_health_v3/queries.jsonl
  agent_eval_set_path: examples/public_health_v3/queries.jsonl
retrieval:
  method: dense
  top_k: 3
  rerank:
    model: BAAI/bge-reranker-v2-m3
    revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
    local_files_only: true
    candidates: 5
# 摘录未通过校验时，带原因重试一次；检索 Agent 不能与固定的问题改写同时开启
generation:
  on_invalid: feedback
  agent: true
  context_rewrite: true
leakage_check:
  chunk_fields_to_check: [source, source_id, metadata.raw_id]
  check_question_text: true
  check_answer_key: true
