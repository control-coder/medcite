# 应用离线检索配置（单路 BM25），不复用研究模型或触发任何模型下载。
application:
  mode: retrieval_mock
  topology: single
dataset:
  version: public-health-excerpts-v1
  knowledge_base_path: examples/public_health/chunks.jsonl
  rag_eval_set_path: examples/public_health/queries.jsonl
  agent_eval_set_path: examples/public_health/queries.jsonl
retrieval:
  method: bm25
  bm25_tokenizer: cjk_bigram
  top_k: 3
leakage_check:
  chunk_fields_to_check: [source, source_id, metadata.raw_id]
  check_question_text: true
  check_answer_key: true
