# 应用 BM25 + 查询改写方案：不需要向量模型缓存，语料为 v2（51 篇、178 条短引）。
# 评测依据见 docs/evaluation.md 第六、七节；搭配 mimo_grounded 使用，每个问题多 1 次改写调用。
application:
  mode: retrieval_mock
  topology: single
runtime:
  device: cpu
  batch_size: 8
embedding:
  model: disabled
  revision: not-used
rerank:
  model: disabled
  revision: not-used
dataset:
  version: public-health-excerpts-v2
  knowledge_base_path: examples/public_health_v2/chunks.jsonl
  rag_eval_set_path: examples/public_health_v2/queries.jsonl
  agent_eval_set_path: examples/public_health_v2/queries.jsonl
retrieval:
  bm25_tokenizer: cjk_bigram
  top_k: 3
  candidate_k: 8
  weights:
    w1_bm25: 1.0
    w2_embedding: 0.0
    w3_evidence_level: 0.0
    w4_term_overlap: 0.0
  evidence_levels:
    level_5_other: 0.3
# 模型输出不合格时带原因重试一次；检索前先改写问题（失败时回退到原问题）。
generation:
  on_invalid: feedback
  rewrite: true
experiments:
  rag:
    rag_full:
      config:
        use_bm25: true
        use_embedding: false
        use_evidence_weighting: false
        use_term_normalization: false
        use_rerank: false
        use_citation_review: false
leakage_check:
  chunk_fields_to_check: [source, source_id, metadata.raw_id]
  check_question_text: true
  check_answer_key: true
